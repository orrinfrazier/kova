name: 'Kova — Autonomous Code Agent'
description: 'Fix GitHub issues autonomously with AI-powered code generation'
branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  mode:
    description: 'Operation mode: fix, auto, or brainstorm'
    required: false
    default: 'fix'
  issue_number:
    description: 'Issue number to fix (required for fix mode unless all is true)'
    required: false
  all:
    description: 'Fix all open issues in sequence (fix mode)'
    required: false
    default: 'false'
  filter:
    description: 'Filter issues by label'
    required: false
  max_issues:
    description: 'Maximum issues to process'
    required: false
    default: '10'
  config:
    description: 'Path to repos.yaml config file'
    required: false
  budget:
    description: 'Maximum USD budget for the run'
    required: false
  force:
    description: 'Override skip logic — re-fix issues with existing PRs'
    required: false
    default: 'false'
  focus:
    description: 'Comma-separated focus areas for brainstorm mode'
    required: false
  trigger_phrase:
    description: 'Phrase that triggers kova when found in an issue comment (e.g. "@kova"). Empty disables comment-based triggering.'
    required: false
    default: '@kova'
  label_trigger:
    description: 'Label whose addition to an issue triggers a fix run. Empty disables label-based triggering.'
    required: false
    default: 'kova'
  assignee_trigger:
    description: 'GitHub username whose assignment to an issue triggers a fix run. Leading "@" is stripped. Empty disables assignee-based triggering.'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Anthropic API key'
    required: true
  github_token:
    description: 'GitHub token for gh CLI (defaults to github.token)'
    required: false

outputs:
  status:
    description: 'Execution status: success or failed'
    value: ${{ steps.run-kova.outputs.status }}
  pr_url:
    description: 'URL of the created PR (fix mode, single issue)'
    value: ${{ steps.run-kova.outputs.pr_url }}
  issues_fixed:
    description: 'Number of issues successfully fixed'
    value: ${{ steps.run-kova.outputs.issues_fixed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install kova
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm ci --ignore-scripts
        npm run build

    - name: Run kova
      id: run-kova
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        KOVA_MODE: ${{ inputs.mode }}
        KOVA_ISSUE: ${{ inputs.issue_number }}
        KOVA_ALL: ${{ inputs.all }}
        KOVA_FILTER: ${{ inputs.filter }}
        KOVA_MAX: ${{ inputs.max_issues }}
        KOVA_CONFIG: ${{ inputs.config }}
        KOVA_BUDGET: ${{ inputs.budget }}
        KOVA_FORCE: ${{ inputs.force }}
        KOVA_FOCUS: ${{ inputs.focus }}
        KOVA_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        KOVA_LABEL_TRIGGER: ${{ inputs.label_trigger }}
        KOVA_ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        KOVA="node ${{ github.action_path }}/dist/cli/index.js"
        ARGS=""

        # Event-aware trigger detection.
        # If the workflow was triggered explicitly (workflow_dispatch with a
        # mode/issue_number, or `all: true`), today's behavior is preserved.
        # Otherwise we inspect GITHUB_EVENT_PATH for a matching label/assignee/
        # comment trigger. No match => exit 0 silently (no kova run).
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          DETECTION=$(node -e '
            const fs = require("fs");
            const path = require("path");
            const actionPath = process.env.ACTION_PATH;
            const { detectMode } = require(path.join(actionPath, "dist/action/index.js"));
            const payload = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const result = detectMode({
              eventName: process.env.GITHUB_EVENT_NAME || "",
              eventPayload: payload,
              config: {
                trigger_phrase: process.env.KOVA_TRIGGER_PHRASE || "",
                label_trigger: process.env.KOVA_LABEL_TRIGGER || "",
                assignee_trigger: process.env.KOVA_ASSIGNEE_TRIGGER || "",
              },
              explicit: {
                mode: process.env.KOVA_MODE || undefined,
                issue_number: process.env.KOVA_ISSUE || undefined,
                all: process.env.KOVA_ALL === "true",
              },
            });
            process.stdout.write(JSON.stringify(result || {}));
          ' 2>/tmp/kova-detect.err) || {
            echo "::warning::detectMode failed: $(cat /tmp/kova-detect.err 2>/dev/null)"
            DETECTION=""
          }
          if [ -n "$DETECTION" ] && [ "$DETECTION" != "{}" ]; then
            DETECTED_MODE=$(echo "$DETECTION" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);process.stdout.write(o.mode||"")})')
            DETECTED_ISSUE=$(echo "$DETECTION" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);process.stdout.write(o.issue_number||"")})')
            DETECTED_SOURCE=$(echo "$DETECTION" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);process.stdout.write(o.source||"")})')
            echo "Kova trigger detected: mode=$DETECTED_MODE issue=$DETECTED_ISSUE source=$DETECTED_SOURCE"
            KOVA_MODE="$DETECTED_MODE"
            [ -n "$DETECTED_ISSUE" ] && KOVA_ISSUE="$DETECTED_ISSUE"
          elif [ -z "$KOVA_ISSUE" ] && [ "$KOVA_ALL" != "true" ] && [ "$KOVA_MODE" = "fix" ]; then
            # No explicit fix target and no event trigger matched — exit cleanly.
            echo "No kova trigger matched event $GITHUB_EVENT_NAME; skipping."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        # Global options
        if [ -n "$KOVA_CONFIG" ]; then
          ARGS="--config $KOVA_CONFIG"
        fi

        case "$KOVA_MODE" in
          fix)
            ARGS="$ARGS fix"
            if [ "$KOVA_ALL" = "true" ]; then
              ARGS="$ARGS --all"
            elif [ -n "$KOVA_ISSUE" ]; then
              ARGS="$ARGS $KOVA_ISSUE"
            else
              echo "::error::issue_number is required for fix mode (or set all: true)"
              exit 1
            fi
            [ -n "$KOVA_FILTER" ] && ARGS="$ARGS --filter $KOVA_FILTER"
            [ -n "$KOVA_MAX" ] && ARGS="$ARGS --max $KOVA_MAX"
            [ -n "$KOVA_BUDGET" ] && ARGS="$ARGS --budget $KOVA_BUDGET"
            [ "$KOVA_FORCE" = "true" ] && ARGS="$ARGS --force"
            ;;
          auto)
            ARGS="$ARGS auto"
            [ -n "$KOVA_FILTER" ] && ARGS="$ARGS --filter $KOVA_FILTER"
            [ -n "$KOVA_MAX" ] && ARGS="$ARGS --max $KOVA_MAX"
            [ "$KOVA_FORCE" = "true" ] && ARGS="$ARGS --force"
            ;;
          brainstorm)
            ARGS="$ARGS brainstorm --yes"
            [ -n "$KOVA_FOCUS" ] && ARGS="$ARGS --focus $KOVA_FOCUS"
            ;;
          *)
            echo "::error::Unknown mode: $KOVA_MODE"
            exit 1
            ;;
        esac

        echo "::group::Running kova $ARGS"
        set +e
        $KOVA $ARGS 2>&1 | tee /tmp/kova-output.log
        EXIT_CODE=${PIPESTATUS[0]}
        set -e
        echo "::endgroup::"

        # Extract outputs
        if [ $EXIT_CODE -eq 0 ]; then
          echo "status=success" >> "$GITHUB_OUTPUT"

          # Extract PR URL from output (fix mode)
          PR_URL=$(grep -oE 'https://github\.com/[^ ]+/pull/[0-9]+' /tmp/kova-output.log | tail -1 || true)
          if [ -n "$PR_URL" ]; then
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          fi

          # Extract issues fixed count from loop output
          FIXED=$(grep -oE '[0-9]+/[0-9]+ succeeded' /tmp/kova-output.log | head -1 | grep -oE '^[0-9]+' || true)
          if [ -n "$FIXED" ]; then
            echo "issues_fixed=$FIXED" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "::error::kova exited with code $EXIT_CODE"
          exit $EXIT_CODE
        fi
